name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/core/pyproject.toml

      - name: Install packages/core with its test dependencies
        run: python -m pip install -e "packages/core[dev]"

      # No Ollama on the runner: the suite uses fake model clients and a
      # deterministic test embedder, so it needs no model and no network.
      - name: Run the full test suite
        working-directory: packages/core
        run: python -m pytest -q
