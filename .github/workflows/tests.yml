name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/core/pyproject.toml

      - name: Install packages/core with its test dependencies
        run: python -m pip install -e "packages/core[dev]"

      # No Ollama on the runner: the suite uses fake model clients and a
      # deterministic test embedder, so it needs no model and no network.
      - name: Run the full test suite
        working-directory: packages/core
        run: python -m pytest -q

  macpilot:
    name: macpilot (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/macpilot/pyproject.toml

      - name: Install packages/macpilot with its test dependencies
        run: python -m pip install -e "packages/macpilot[dev]"

      - name: Install Playwright's Chromium
        run: python -m playwright install --with-deps chromium

      # The end-to-end tests skip when Chromium is missing. In CI it is
      # installed above, so a skip means a broken setup and fails the job.
      - name: Run the MacPilot test suite
        working-directory: packages/macpilot
        shell: bash  # -eo pipefail, so a pytest failure isn't hidden by tee
        run: |
          python -m pytest -q -rs | tee pytest.log
          if grep -qE '[0-9]+ skipped' pytest.log; then
            echo "::error::MacPilot tests were skipped in CI"; exit 1
          fi

  graphrag:
    name: graphrag (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/graphrag/pyproject.toml

      - name: Install packages/graphrag with its test dependencies
        run: python -m pip install -e "packages/graphrag[dev]"

      # No Ollama on the runner: the suite uses the deterministic hashing
      # embedder. The gate tests must run, not skip, so a skip fails the job.
      # The corpus test regenerates corpus v1 and compares it byte for byte.
      - name: Run the GraphRAG test suite
        working-directory: packages/graphrag
        shell: bash  # -eo pipefail, so a pytest failure isn't hidden by tee
        run: |
          python -m pytest -q -rs | tee pytest.log
          if grep -qE '[0-9]+ skipped' pytest.log; then
            echo "::error::GraphRAG tests were skipped in CI"; exit 1
          fi

  voice:
    name: voice (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/core/pyproject.toml
            packages/voice/pyproject.toml

      # Voice Lab reuses core's PermissionGate and trace store, so core is installed alongside it.
      - name: Install packages/core and packages/voice with its test dependencies
        run: python -m pip install -e packages/core -e "packages/voice[dev]"

      # Fake STT/TTS adapters only: no audio, no microphone, no API keys, no network.
      # The action-safety tests must run, not skip, so a skip fails the job.
      - name: Run the Voice Lab test suite
        working-directory: packages/voice
        shell: bash  # -eo pipefail, so a pytest failure isn't hidden by tee
        run: |
          python -m pytest -q -rs | tee pytest.log
          if grep -qE '[0-9]+ skipped' pytest.log; then
            echo "::error::Voice Lab tests were skipped in CI"; exit 1
          fi

  demo:
    name: demo (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/core/pyproject.toml
            packages/voice/pyproject.toml
            packages/demo/pyproject.toml

      # The demo runs the voice loop in-process, so core and voice are installed alongside it.
      - name: Install packages/core, packages/voice and packages/demo with its test dependencies
        run: python -m pip install -e packages/core -e packages/voice -e "packages/demo[dev]"

      # Mocked speech providers only: no audio device, no API keys, no network (sockets are refused).
      # The ledger-order and gate tests must run, not skip, so a skip fails the job.
      - name: Run the demo test suite
        working-directory: packages/demo
        shell: bash  # -eo pipefail, so a pytest failure isn't hidden by tee
        run: |
          python -m pytest -q -rs | tee pytest.log
          if grep -qE '[0-9]+ skipped' pytest.log; then
            echo "::error::demo tests were skipped in CI"; exit 1
          fi
