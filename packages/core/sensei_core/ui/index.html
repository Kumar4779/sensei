<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#111418">
<title>Sensei</title>
<!--
  Public shell (Slice 22). It holds no data. It asks for the gateway token once,
  keeps it in sessionStorage only (gone when the tab closes), and loads the app
  (/ui/app/app.css, /ui/app/app.js) with X-Sensei-Token, which every data
  endpoint requires too.
-->
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #15181c; --muted: #5f6670; --card: #fff; --line: #e1e1dc; --accent: #1f5fbf; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111418; --fg: #eceae5; --muted: #9aa1aa; --card: #1a1e24; --line: #2b3038; --accent: #7aa7ff; } }
  body { margin: 0; font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  #login { max-width: 420px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 48px) 20px 24px; }
  #login h1 { font-size: 28px; margin: 0 0 4px; }
  #login p { color: var(--muted); margin: 0 0 20px; }
  #login input { width: 100%; box-sizing: border-box; font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  #login button { margin-top: 12px; width: 100%; font: inherit; font-weight: 600; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; }
  #login .err { color: #c0392b; min-height: 1.4em; margin-top: 10px; }
</style>
</head>
<body>
<form id="login" autocomplete="off">
  <h1>Sensei 🥋</h1>
  <p>Enter the gateway token. It is kept for this tab only.</p>
  <input id="token" type="password" inputmode="text" autocapitalize="off" spellcheck="false" placeholder="SENSEI_GATEWAY_TOKEN" aria-label="Gateway token" required>
  <button type="submit">Open</button>
  <div class="err" id="err" role="alert"></div>
</form>
<div id="app" hidden></div>
<script>
(function () {
  "use strict";
  var KEY = "sensei.token";
  var form = document.getElementById("login");
  var err = document.getElementById("err");

  function load(token) {
    var h = { "X-Sensei-Token": token };
    return Promise.all([
      fetch("/ui/app/app.css", { headers: h, cache: "no-store" }),
      fetch("/ui/app/app.js", { headers: h, cache: "no-store" })
    ]).then(function (rs) {
      if (rs[0].status === 401 || rs[1].status === 401) { throw new Error("unauthorized"); }
      if (!rs[0].ok || !rs[1].ok) { throw new Error("could not load the app (HTTP " + rs[1].status + ")"); }
      return Promise.all([rs[0].text(), rs[1].text()]);
    }).then(function (parts) {
      var style = document.createElement("style");
      style.textContent = parts[0];
      document.head.appendChild(style);
      var url = URL.createObjectURL(new Blob([parts[1]], { type: "text/javascript" }));
      var script = document.createElement("script");
      script.src = url;
      document.body.appendChild(script);
      form.hidden = true;
    });
  }

  function start(token) {
    err.textContent = "";
    load(token).catch(function (e) {
      sessionStorage.removeItem(KEY);
      form.hidden = false;
      err.textContent = e.message === "unauthorized" ? "That token was not accepted." : e.message;
    });
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var token = document.getElementById("token").value.trim();
    if (!token) { return; }
    sessionStorage.setItem(KEY, token);
    document.getElementById("token").value = "";
    start(token);
  });

  var saved = sessionStorage.getItem(KEY);
  if (saved) { form.hidden = true; start(saved); }
})();
</script>
</body>
</html>
