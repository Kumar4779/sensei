# Sensei routing table — model is a config, never code (DESIGN.md Principle 1).
# local_private is pinned to qwen3:8b (Decision 3 as amended, 16 GB hardware).
# cheap_api is Kimi via the Moonshot API (Slice 35, the first real backend); frontier_api is a placeholder.
#
# tier:        local | cheap_api | frontier_api
# sensitivity: classes a route may receive (DESIGN.md Threat 5).
#              LOCAL_ONLY content may only go to a local tier.
# max_sensitivity:        most sensitive class the route may receive.
# est_cost_per_1k_tokens: estimated USD per 1k tokens, applied to input and output alike.
#                         Placeholder for frontier_api; from published pricing for cheap_api.
# think (optional):      Ollama thinking mode; omit to use the server default.

[routes.local_private]
provider = "ollama"
model = "qwen3:8b"
tier = "local"
sensitivity = ["LOCAL_ONLY", "API_OK"]
max_sensitivity = "LOCAL_ONLY"
est_cost_per_1k_tokens = 0.0
# think = false: Slice 15 experiment, morning-brief-001 only (qwen3:8b, 3 trials each, same session):
#   think unset: pass^3 1.00, p50 34.5 s, p95 37.7 s  (evals/results/morning-brief-001-v1-20261124-4.json)
#   think false: pass^3 1.00, p50  9.5 s, p95  9.9 s  (evals/results/morning-brief-001-v1-20261124-5.json)
# Measured on one summarisation task; not evidence for other task types.
think = false

# Slice 35: Kimi K3 via https://api.moonshot.ai/v1/chat/completions. Key from the macOS
# Keychain (service sensei-kimi-api-key, account sensei); never in this file.
# Published price (Moonshot's K3 announcement, 2026-07-22): $3.00 / MTok uncached input,
# $0.30 cached input, $15.00 / MTok output. The estimate applies the output price to
# every token: an upper bound on visible tokens, so the spend caps err on the safe side.
# It does not count hidden reasoning tokens (bounded per call by the client's
# max_completion_tokens). Real billed usage is on the Moonshot console.
[routes.cheap_api]
provider = "kimi"
model = "kimi-k3"
tier = "cheap_api"
sensitivity = ["API_OK"]
max_sensitivity = "API_OK"
est_cost_per_1k_tokens = 0.015

# Placeholder (no frontier backend yet). Slice 35 raised its estimate from 0.01 to 0.05 so it
# stays above the real cheap_api price: the frontier tier is the expensive one.
[routes.frontier_api]
provider = "frontier"
model = "frontier-placeholder"
tier = "frontier_api"
sensitivity = ["API_OK"]
max_sensitivity = "API_OK"
est_cost_per_1k_tokens = 0.05

# Custodian (Slice 21): embeddings for the memory index, a DERIVED layer rebuilt
# from the entry files. Thresholds measured on nomic-embed-text, no task prefixes
# (2026-11-25, 5 facts x 6 queries, 4 near-duplicate pairs):
#   concept queries: right fact ranked first 5/5, scores 0.58-0.79; unrelated query best 0.41
#   paraphrase duplicates 0.89-0.92; a different fact on the same pattern 0.83
[embeddings]
provider = "ollama"
model = "nomic-embed-text"
search_min_score = 0.50
dedup_threshold = 0.88

# Spend caps (Slice 29, DESIGN.md Threat 7): estimated USD, the same basis as the
# CostLedger. They apply to API routes only; local routes cost nothing and are
# exempt (never from the kill switch). A key left unset means no cap. Example:
#   daily_cap_usd = 1.00
#   monthly_cap_usd = 20.00
# A spend_alert is traced once per day at 50% and at 80% of daily_cap_usd.
# Slice 35: a conservative $1.00 a day for the first real-backend period. This is
# config, the owner's to change.
[budgets]
daily_cap_usd = 1.00
