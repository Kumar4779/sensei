[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensei_core"
version = "0.1.0"
description = "Sensei core: trace store and model routing config"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["sensei_core"]

[tool.setuptools.package-data]
sensei_core = ["models.toml", "tools.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
