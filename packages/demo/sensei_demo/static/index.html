<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Talk to Sensei</title>
<!--
  Public shell (Demo Slice 1), after the gateway's /ui. It holds no data. It
  asks for the demo token once, keeps it in sessionStorage only (gone when the
  tab closes), and loads the app (/demo/app/app.css, /demo/app/app.js) with
  X-Sensei-Token, which every data endpoint requires too.
-->
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #15181c; --muted: #5f6670; --card: #fff; --line: #e1e1dc; --accent: #1f5fbf; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111418; --fg: #eceae5; --muted: #9aa1aa; --card: #1a1e24; --line: #2b3038; --accent: #7aa7ff; } }
  body { margin: 0; font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  #login { max-width: 420px; margin: 0 auto; padding: 64px 20px 24px; }
  #login h1 { font-size: 28px; margin: 0 0 4px; }
  #login p { color: var(--muted); margin: 0 0 20px; }
  #login input { width: 100%; box-sizing: border-box; font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  #login button { margin-top: 12px; width: 100%; font: inherit; font-weight: 600; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  #login .err { color: #c0392b; min-height: 1.4em; margin-top: 10px; }
</style>
</head>
<body>
<form id="login" autocomplete="off">
  <h1>Talk to Sensei</h1>
  <p>Enter the demo token. It is kept for this tab only.</p>
  <input id="token" type="password" autocapitalize="off" spellcheck="false" placeholder="SENSEI_DEMO_TOKEN" aria-label="Demo token" required>
  <button type="submit">Open</button>
  <div class="err" id="err" role="alert"></div>
</form>
<div id="app" hidden></div>
<script>
(function () {
  "use strict";
  var KEY = "sensei.demo.token";
  var form = document.getElementById("login");
  var err = document.getElementById("err");

  function load(token) {
    var h = { "X-Sensei-Token": token };
    return Promise.all([
      fetch("/demo/app/app.css", { headers: h, cache: "no-store" }),
      fetch("/demo/app/app.js", { headers: h, cache: "no-store" })
    ]).then(function (rs) {
      if (rs[0].status === 401 || rs[1].status === 401) { throw new Error("unauthorized"); }
      if (!rs[0].ok || !rs[1].ok) { throw new Error("could not load the app (HTTP " + rs[1].status + ")"); }
      return Promise.all([rs[0].text(), rs[1].text()]);
    }).then(function (parts) {
      var style = document.createElement("style");
      style.textContent = parts[0];
      document.head.appendChild(style);
      var script = document.createElement("script");
      script.src = URL.createObjectURL(new Blob([parts[1]], { type: "text/javascript" }));
      document.body.appendChild(script);
      form.hidden = true;
      document.getElementById("app").hidden = false;
    });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var token = document.getElementById("token").value.trim();
    err.textContent = "";
    sessionStorage.setItem(KEY, token);  // set before the app script runs, which reads it
    load(token).catch(function (x) {
      sessionStorage.removeItem(KEY);
      err.textContent = x.message === "unauthorized" ? "That token was rejected." : x.message;
    });
  });

  var saved = sessionStorage.getItem(KEY);
  if (saved) { load(saved).catch(function () { sessionStorage.removeItem(KEY); }); }
})();
</script>
</body>
</html>
