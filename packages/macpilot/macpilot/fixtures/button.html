<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MacPilot fixture: one button</title>
<!-- MacPilot Slice 1 test page. The button fills the centre of the viewport,
     so the normalized point (500, 500) lands on it at any viewport size.
     Clicking it changes the status text: the goal state the demo checks. -->
<style>
  html, body { margin: 0; height: 100%; font: 20px -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  #go { width: 40vw; height: 30vh; font-size: 28px; border: 0; border-radius: 16px; background: #1f5fbf; color: #fff; }
  #status { position: fixed; top: 24px; left: 0; right: 0; text-align: center; }
</style>
</head>
<body>
  <p id="status">Not clicked</p>
  <button id="go" type="button">Click me</button>
  <script>
    document.getElementById("go").addEventListener("click", function () {
      document.getElementById("status").textContent = "Clicked";
    });
  </script>
</body>
</html>
